name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Placeholders only: src/config/env.ts validates these at import time.
    # No step talks to a database, Redis or any third-party API.
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tabla_ci
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      APP_ROOT_DOMAIN: localhost:3000
      APP_PUBLIC_URL: http://localhost:3000
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
